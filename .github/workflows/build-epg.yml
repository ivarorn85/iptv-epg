name: Build EPG

on:
  schedule:
    # epgshare01 regenerates around 05:30 UTC, so the morning slot runs after
    # it. The afternoon one is a backup: GitHub's scheduler is best-effort and
    # both delays and outright skipped occurrences are normal, so a single slot
    # a day means a missed slot is a missed day. Republishing is harmless —
    # the gate and the release upload are both idempotent.
    #
    # Odd minutes on purpose: the top of the hour is when the queue is worst.
    - cron: "17 6 * * *"
    - cron: "43 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The build makes ~90 requests across a dozen upstreams, none of which owe
    # us a timely answer. Without this a single hung host would sit on the
    # runner's 6-hour default before the failure mail ever arrives.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Before the build, not after: the matching keys are where a mistake
      # produces a wrong schedule rather than an error, so a break there must
      # stop the run instead of publishing quietly.
      - name: Test
        run: node --test

      # Each source's last good output, so one upstream failing costs its
      # channels nothing — cache.mjs explains the bounds. Cache keys are
      # write-once, hence the run-id key with a prefix restore: every run
      # reads the newest entry and writes a fresh one. Losing it entirely is
      # only a lost safety net, so nothing here is load-bearing.
      - name: Restore the source cache
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: epg-cache-${{ github.run_id }}
          restore-keys: epg-cache-

      - name: Build guide
        env:
          XTREAM_HOST: ${{ secrets.XTREAM_HOST }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          # epg-us is 500 MB uncompressed; don't leave the heap to chance.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          # Before the build, not by it: the save step below refuses a path that
          # does not exist, and on a cold start with a failing first source
          # nothing would have created it.
          mkdir -p cache
          node build-epg.mjs

      # Immediately after the build and regardless of what follows: a run whose
      # guide the gate then refuses still fetched sources that worked, and
      # tomorrow's run should have them.
      - name: Save the source cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: cache
          key: epg-cache-${{ github.run_id }}

      # Refuses a guide that would empty the grid — too small, too stale, or
      # self-contradictory. The job stops here and the last good release stays
      # up. A source regressing does not stop it: that is reported at the end,
      # after the working channels have their fresh data. --record updates
      # status.json, which is the next run's baseline.
      - name: Check the guide is publishable
        run: node check-guide.mjs --record

      # Served from a release rather than from git, so the repository does not
      # grow by 8 MB a day. The tag is fixed, so the download URL never changes.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view epg >/dev/null 2>&1 ||
            gh release create epg --title "EPG" \
              --notes "Rolling XMLTV guide. The asset is replaced daily; this release is the stable download URL."
          gh release upload epg guide.xml.gz --clobber

      # A few hundred bytes a day. Records what was published and how many
      # channels each source contributed, and keeps the repository active so
      # GitHub does not disable the schedule for inactivity. Rebases first
      # because the guide is already live by this point: a push that races a
      # human commit should not turn a good run red.
      - name: Record the run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          # Guarded rather than unconditional: status.json carries a timestamp
          # so it always differs, but a bare commit would fail the step if that
          # ever stops being true.
          git diff --quiet --cached || git commit -m "EPG $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Last, so a source regressing turns the run red without having held up
      # the publish. The guide is already live and the baseline already
      # recorded, so this fails once per regression rather than for as long as
      # the source stays broken — the log and status.json carry it from there.
      - name: Report a regressed source
        run: node check-guide.mjs --regressions
